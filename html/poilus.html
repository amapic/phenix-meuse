<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="author" content="Mémoire en Meuse" />
  <link rel="icon" href="favicon.ico" type="image/x-icon" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500;1,600&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" />
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <style type="text/tailwindcss">
    @theme inline {
      --radius-sm: calc(var(--radius) - 4px);
      --radius-md: calc(var(--radius) - 2px);
      --radius-lg: var(--radius);
      --radius-xl: calc(var(--radius) + 4px);
      --radius-2xl: calc(var(--radius) + 8px);
      --radius-3xl: calc(var(--radius) + 12px);
      --color-background: var(--background);
      --color-foreground: var(--foreground);
      --color-card: var(--card);
      --color-primary: var(--primary);
      --color-primary-foreground: var(--primary-foreground);
      --color-muted: var(--muted);
      --color-border: var(--border);
      --font-display: "Cormorant Garamond", Georgia, serif;
      --font-body: "Inter", ui-sans-serif, system-ui, sans-serif;
      --font-mono: "JetBrains Mono", ui-monospace, monospace;
      --ease-glass: cubic-bezier(0.32, 0.72, 0, 1);
    }
    :root {
      --radius: 1rem;
      --background: oklch(0.977 0.012 85);
      --foreground: oklch(0.21 0.022 253);
      --card: oklch(0.985 0.008 85);
      --primary: oklch(0.52 0.16 30);
      --primary-foreground: oklch(0.977 0.012 85);
      --muted: oklch(0.53 0.02 253);
      --border: oklch(0.21 0.022 253 / 0.1);
      --panel: oklch(0.99 0.004 85 / 0.55);
    }
    .glass {
      background: var(--panel);
      backdrop-filter: blur(18px) saturate(1.1);
      border: 1px solid oklch(0.99 0.004 85 / 0.7);
      box-shadow: inset 0 1px 0 oklch(1 0 0 / 0.8), 0 24px 48px -24px oklch(0.21 0.022 253 / 0.18);
    }
    .glass-soft {
      background: oklch(0.99 0.004 85 / 0.4);
      backdrop-filter: blur(12px);
      border: 1px solid oklch(0.99 0.004 85 / 0.6);
    }
    .bg-frost {
      background:
        radial-gradient(60% 55% at 18% 12%, oklch(0.52 0.16 30 / 0.1), transparent 60%),
        radial-gradient(50% 50% at 85% 20%, oklch(0.72 0.05 240 / 0.18), transparent 60%),
        radial-gradient(70% 60% at 50% 100%, oklch(0.94 0.02 85 / 0.6), transparent 70%),
        var(--background);
    }
    @keyframes rise {
      from { opacity: 0; transform: translateY(18px); }
      to { opacity: 1; transform: translateY(0); }
    }
    @utility animate-rise { animation: rise 0.9s var(--ease-glass) both; }
    @layer base {
      * { border-color: var(--color-border); }
      html { scroll-behavior: smooth; }
      body { background-color: var(--color-background); color: var(--color-foreground); font-family: var(--font-body); }
    }
  </style>
  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <title>Annuaire des Poilus — Mémoire en Meuse</title>
  <meta name="description" content="Découvrez les biographies de soldats tombés en Meuse pendant la Première Guerre mondiale. Retrouvez leurs parcours et le lieu où ils reposent." />
  <script src="js/data.js"></script>
  <script src="js/common.js"></script>
</head>
<body>
<div class="min-h-screen bg-frost font-body text-foreground antialiased">
  <header class="sticky top-0 z-40 px-4 pt-4">
    <nav class="glass mx-auto flex max-w-6xl items-center justify-between rounded-2xl px-5 py-3">
      <a href="index.html" class="flex items-center gap-3">
        <div class="grid size-8 place-items-center rounded-full bg-primary/90">
          <span class="font-mono text-[10px] tracking-widest text-primary-foreground">M</span>
        </div>
        <div class="leading-tight">
          <p class="font-display text-lg font-semibold italic tracking-tight">Mémoire en Meuse</p>
          <p class="font-mono text-[10px] uppercase tracking-[0.2em] text-muted">Annuaire des poilus</p>
        </div>
      </a>
      <a href="index.html" class="hidden rounded-full bg-foreground px-4 py-2 text-sm font-medium text-background transition-colors hover:bg-foreground/90 md:inline-block">Retour à l'accueil</a>
    </nav>
  </header>

  <section class="mx-auto max-w-6xl px-4 pt-16 pb-10">
    <div class="animate-rise">
      <p class="font-mono mb-6 text-[11px] uppercase tracking-[0.25em] text-primary">1914–1918 · Mémoire vivante</p>
      <h1 class="font-display text-balance text-5xl leading-[0.95] font-semibold tracking-tight">Biographies <br /><em class="font-medium text-primary italic">des poilus</em></h1>
      <p class="mt-8 max-w-[46ch] text-lg leading-relaxed text-foreground/80 text-pretty">Retrouvez les parcours de soldats tombés en Meuse. Leurs noms, leurs vies, et les lieux où ils reposent à jamais.</p>
    </div>
  </section>

  <section class="mx-auto max-w-6xl px-4 py-6">
    <div class="glass rounded-2xl p-6">
      <div class="space-y-4">
        <input id="search" type="search" placeholder="Rechercher un nom, un régiment, un lieu…" class="w-full rounded-lg border border-border bg-background px-4 py-3 text-sm font-body placeholder-muted focus:outline-none focus:ring-2 focus:ring-primary/50" />
        <div class="space-y-2">
          <p class="text-xs font-medium uppercase tracking-wide text-muted">Filtrer par</p>
          <div id="tags" class="flex flex-wrap gap-2"></div>
        </div>
      </div>
    </div>
    <div class="mt-4 flex items-center justify-between">
      <p id="count" class="text-sm text-muted"></p>
      <button id="reset" type="button" class="hidden text-xs text-primary hover:text-primary/80 transition-colors">Réinitialiser</button>
    </div>
  </section>

  <section class="mx-auto max-w-6xl px-4 pb-20">
    <div id="grid" class="grid grid-cols-1 gap-6 sm:grid-cols-2 lg:grid-cols-3"></div>
    <div id="empty" class="glass hidden rounded-2xl p-12 text-center">
      <p class="text-muted">Aucun résultat trouvé.</p>
      <button id="empty-reset" type="button" class="mt-4 text-sm text-primary hover:text-primary/80 transition-colors">Voir tous les poilus</button>
    </div>
  </section>
</div>

<script>
$(function () {
  var selectedTag = null;
  var tagClasses = {
    on: "bg-primary text-primary-foreground",
    off: "border border-border bg-background text-foreground hover:border-primary/50"
  };

  $.each(MEM.allTags(), function (_, tag) {
    $("<button>", { type: "button", "data-tag": tag })
      .addClass("rounded-full px-3 py-1 text-xs font-medium transition-all " + tagClasses.off)
      .text(tag)
      .appendTo("#tags");
  });

  function render() {
    var q = $("#search").val();
    var results = MEM.search(q, selectedTag);
    $("#grid").empty().append(results.map(function (p) { return MEM.card(p, false); }));
    $("#grid").toggleClass("hidden", !results.length);
    $("#empty").toggleClass("hidden", results.length > 0);
    $("#count").text(results.length + " biographie" + (results.length !== 1 ? "s" : ""));
    $("#reset").toggleClass("hidden", !(q || selectedTag));
    $("#empty-reset").toggleClass("hidden", !(q || selectedTag));
    $("#tags button").each(function () {
      var on = $(this).data("tag") === selectedTag;
      $(this).attr("class", "rounded-full px-3 py-1 text-xs font-medium transition-all " + (on ? tagClasses.on : tagClasses.off));
    });
  }

  function reset() {
    $("#search").val("");
    selectedTag = null;
    render();
  }

  $("#search").on("input", render);
  $("#tags").on("click", "button", function () {
    var t = $(this).data("tag");
    selectedTag = selectedTag === t ? null : t;
    render();
  });
  $("#reset, #empty-reset").on("click", reset);
  render();
});
</script>
</body>
</html>
